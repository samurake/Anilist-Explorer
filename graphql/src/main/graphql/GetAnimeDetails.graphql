query GetAnimeDetails($id: Int) {
  Media(id: $id, type: ANIME) {
    id
    title {
      romaji
      english
    }
    coverImage {
      large
    }
    bannerImage
    description(asHtml: false)
    averageScore
    isAdult
    format
    status
    duration
    genres
    characters(sort: [ROLE, ID_DESC], page: 1, perPage: 10) {
      edges {
        role
        node {
          id
          name {
            full
          }
          image {
            large
          }
        }
      }
    }
  }
}
